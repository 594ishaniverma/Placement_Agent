[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "placement-agent"
version = "0.1.0"
description = "Human-in-the-loop placement eligibility agent"
requires-python = ">=3.10"
dependencies = [
  "faker>=24",
  "mcp>=1.0",
]

[project.optional-dependencies]
agent = [
  "anthropic>=0.40",
  "langgraph>=0.2",
  "langchain-anthropic>=0.3",
  "python-dotenv>=1.0",
]
eval = [
  "langsmith>=0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
